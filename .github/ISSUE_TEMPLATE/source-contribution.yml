name: Source contribution
description: Suggest a historical source (map, timetable, census table, dataset)
labels: [source]
body:
  - type: input
    id: title
    attributes: { label: Source title }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: URL or archival location }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: What it documents and its reuse terms }
