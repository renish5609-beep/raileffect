name: Data correction
description: Report a misread census figure, misplaced town, or railroad error
labels: [data-correction]
body:
  - type: input
    id: town
    attributes: { label: Town and county, placeholder: "Denison, Grayson County" }
    validations: { required: true }
  - type: input
    id: year
    attributes: { label: Census year or benchmark year }
  - type: input
    id: current
    attributes: { label: Value currently shown on RailEffect }
  - type: input
    id: proposed
    attributes: { label: Value you believe is correct }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Census table and page, archival item URL, or other source. Corrections are checked against the page image before being accepted.
    validations: { required: true }
